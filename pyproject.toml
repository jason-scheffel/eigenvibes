[project]
name = "eigenvibes"
version = "0.1.0"
description = "Course project for CSI 436/536 (Fall 2026, University at Albany)."
license = "BSD-3-Clause"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "reuse>=6.2.0",
    "ruff>=0.16.9",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
