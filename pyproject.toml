[project]
name = "eigenvibes"
version = "0.1.0"
description = "Course project for CSI 436/536 (Fall 2026, University at Albany)."
license = "BSD-3-Clause"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "typer>=0.27.2",
]

[project.optional-dependencies]
cpu = ["torch>=2.14.0"]
cu130 = ["torch>=2.14.0"]
rocm = [
    "torch>=2.14.0",
    "triton-rocm>=3.8.0 ; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "reuse[charset-normalizer]>=6.2.0",
    "ruff>=0.16.9",
    "scipy-stubs>=1.18.1.1",
    "types-tqdm>=4.70.0.20260906",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
    { extra = "rocm" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
  { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "statsmodels.*"]
ignore_missing_imports = true
